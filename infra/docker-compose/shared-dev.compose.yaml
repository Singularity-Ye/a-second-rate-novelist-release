services:
  backend:
    image: ghcr.io/erliu/backend:${ARTIFACT_SHA:-shared-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: shared-dev
      ENVIRONMENT_KEY: shared-dev
      DATABASE_URL: postgresql://erlx:erlx-dev@postgres:5432/erlx_shared_dev
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: erlx-shared-dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  h5:
    image: ghcr.io/erliu/h5:${ARTIFACT_SHA:-shared-dev}
    environment:
      APP_ENV: shared-dev
  ops:
    image: ghcr.io/erliu/ops:${ARTIFACT_SHA:-shared-dev}
    environment:
      APP_ENV: shared-dev
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erlx_shared_dev
      POSTGRES_USER: erlx
      POSTGRES_PASSWORD: erlx-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erlx -d erlx_shared_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set erlx http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing erlx/erlx-shared-dev
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
