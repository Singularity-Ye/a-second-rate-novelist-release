services:
  backend:
    image: ghcr.io/erliu/backend:${ARTIFACT_SHA:-staging}
    environment:
      APP_ENV: staging
      ENVIRONMENT_KEY: staging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  h5:
    image: ghcr.io/erliu/h5:${ARTIFACT_SHA:-staging}
    environment:
      APP_ENV: staging
  ops:
    image: ghcr.io/erliu/ops:${ARTIFACT_SHA:-staging}
    environment:
      APP_ENV: staging
