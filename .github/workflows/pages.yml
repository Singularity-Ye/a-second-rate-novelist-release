name: Deploy public room to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/h5/**"
      - "apps/pages-h5/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      PAGES_REQUIRE_REMOTE_API: "true"
      NEXT_PUBLIC_API_BASE_URL: https://gongsi.tail5f51f2.ts.net:8443
      NEXT_PUBLIC_PUBLIC_ROOM_DEMO: "true"
      NEXT_PUBLIC_STRICT_RUNTIME_API_BASE: "true"
      NEXT_PUBLIC_NOVELIST_CHAT_LOCAL_PREVIEW: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter pages-h5... --filter h5
      - name: Refuse a UI-only deployment
        shell: bash
        run: test -n "$NEXT_PUBLIC_API_BASE_URL"
      - name: Verify the public room gateway from outside the tailnet
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          gateway="${NEXT_PUBLIC_API_BASE_URL%/}"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            "${gateway}/healthz" >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --request OPTIONS \
            --header "Origin: https://${owner}.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "${gateway}/vnext/room/messages/stream" >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --request OPTIONS \
            --header "Origin: https://${owner}.github.io" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "${gateway}/vnext/room/life-suggestions" >/dev/null
      - run: pnpm --filter pages-h5 test
      - run: pnpm --filter pages-h5 build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/pages-h5/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
